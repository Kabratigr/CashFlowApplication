spring.application.name=transaction-service
spring.config.import=optional:file:environment.properties
server.port=8083

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

spring.datasource.url=jdbc:mysql://mysql:3306/transactionservice?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=\
  com.cashflow.userservice.dto.UserModificationKafkaDto:com.cashflow.transactionservice.dto.UserModificationKafkaDto
spring.kafka.consumer.properties.spring.json.trusted.packages=*

saltedge.app-id=${SALTEDGE_ID}
saltedge.secret=${SALTEDGE_SECRET}

jwt.secret=${JWT_SECRET}
internal.key=${INTERNAL_KEY}
